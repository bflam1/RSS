name: Generate & Deploy Mend Release Notes

on:
  schedule:
    # Backup only. The on-time 08:30 AM Central run is a workflow_dispatch from
    # a local scheduled task, because GitHub starts scheduled runs hours late.
    # This fires Mon/Tue at 16:07 UTC (11:07 AM CDT / 10:07 AM CST), off the
    # :00/:30 peak, so the feed still publishes when that machine is off.
    - cron: '7 16 * * 1,2'
  workflow_dispatch:

# Prevent overlapping runs — cancel any in-progress run for the same trigger
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run RSS/HTML generator
        run: |
          python RSSFEED.py

      - name: Prepare Docs folder
        run: |
          mkdir -p docs
          mv mend_combined_release_feed.html docs/index.html
          mv mend_combined_release_feed.xml docs/rss.xml
          mv mend_combined_release_feed.atom docs/atom.xml

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e  # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs

      - name: Notify on failure
        if: failure()
        run: |
          gh issue create \
            --title "Feed generation failed: $(date -u '+%Y-%m-%d %H:%M UTC')" \
            --body "The scheduled feed generation workflow failed. [View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" \
            --label "bug"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
